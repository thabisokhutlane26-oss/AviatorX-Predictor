name: Build AviatorX AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create project
        run: |

          mkdir -p app/src/main/java/com/aviatorx/predictor
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AviatorXAI"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aviatorx.predictor'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aviatorx.predictor'
                  minSdk 24
                  targetSdk 35
                  versionCode 21
                  versionName "2.1"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="AviatorX AI"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="Theme.MaterialComponents.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080808</item>
                  <item name="android:navigationBarColor">#080808</item>
                  <item name="android:windowBackground">#080808</item>
                  <item name="android:colorAccent">#FF3B30</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/drawable/card_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#151515"/>
              <corners android:radius="18dp"/>
              <stroke
                  android:width="1dp"
                  android:color="#292929"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/input_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#151515"/>
              <corners android:radius="14dp"/>
              <stroke
                  android:width="1dp"
                  android:color="#303030"/>
              <padding
                  android:left="16dp"
                  android:top="4dp"
                  android:right="16dp"
                  android:bottom="4dp"/>
          </shape>
          EOF

          cat > app/src/main/java/com/aviatorx/predictor/MainActivity.kt <<'EOF'
          package com.aviatorx.predictor

          import android.content.Context
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import java.security.MessageDigest
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var serverSeed: EditText
              private lateinit var expectedHash: EditText
              private lateinit var clientSeed: EditText
              private lateinit var multiplierInput: EditText

              private lateinit var verificationResult: TextView
              private lateinit var roundsValue: TextView
              private lateinit var averageValue: TextView
              private lateinit var lowestValue: TextView
              private lateinit var highestValue: TextView
              private lateinit var historyText: TextView

              private val prefsName = "aviatorx_data"
              private val historyKey = "round_history"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildInterface()
                  updateDashboard()
              }

              private fun buildInterface() {

                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(Color.rgb(8, 8, 8))
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(22, 24, 22, 35)
                  }

                  // HEADER

                  val brand = TextView(this).apply {
                      text = "✈️ AVIATORX"
                      textSize = 30f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                  }

                  root.addView(
                      brand,
                      matchParams()
                  )

                  val ai = TextView(this).apply {
                      text = "AI ANALYTICS"
                      textSize = 14f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      letterSpacing = 0.15f
                  }

                  root.addView(
                      ai,
                      matchParams()
                  )

                  addSpace(root, 16)

                  // STATUS CARD

                  val statusCard = card()

                  val statusTitle = TextView(this).apply {
                      text = "●  SYSTEM STATUS"
                      textSize = 14f
                      setTextColor(Color.LTGRAY)
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                  }

                  statusCard.addView(
                      statusTitle,
                      matchParams()
                  )

                  val status = TextView(this).apply {
                      text = "WAITING FOR VERIFIED DATA"
                      textSize = 19f
                      setTextColor(Color.WHITE)
                      typeface = android.graphics.Typeface.DEFAULT_BOLD
                      setPadding(0, 10, 0, 4)
                  }

                  statusCard.addView(
                      status,
                      matchParams()
                  )

                  val statusInfo = TextView(this).apply {
                      text =
                          "Manual verified-data mode • No fake live results"
                      textSize = 13f
                      setTextColor(Color.GRAY)
                  }

                  statusCard.addView(
                      statusInfo,
                      matchParams()
                  )

                  root.addView(statusCard)

                  addSpace(root, 14)

                  // MAIN DASHBOARD

                  val dashboardTitle = sectionTitle(
                      "📊  ROUND DASHBOARD"
                  )

                  root.addView(dashboardTitle)

                  val row1 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }

                  roundsValue = dashboardValue("--")
                  averageValue = dashboardValue("--")

                  row1.addView(
                      metricCard(
                          "ROUNDS",
                          roundsValue
                      ),
                      weightParams()
                  )

                  row1.addView(
                      metricCard(
                          "AVERAGE",
                          averageValue
                      ),
                      weightParams()
                  )

                  root.addView(row1)

                  addSpace(root, 10)

                  val row2 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }

                  lowestValue = dashboardValue("--")
                  highestValue = dashboardValue("--")

                  row2.addView(
                      metricCard(
                          "LOWEST",
                          lowestValue
                      ),
                      weightParams()
                  )

                  row2.addView(
                      metricCard(
                          "HIGHEST",
                          highestValue
                      ),
                      weightParams()
                  )

                  root.addView(row2)

                  addSpace(root, 18)

                  // ROUND ENTRY

                  root.addView(
                      sectionTitle(
                          "➕ ADD COMPLETED ROUND"
                      )
                  )

                  multiplierInput =
                      createInput(
                          "Multiplier e.g. 2.35"
                      )

                  root.addView(multiplierInput)

                  val addButton = primaryButton(
                      "ADD ROUND"
                  )

                  addButton.setOnClickListener {
                      addRound()
                  }

                  root.addView(addButton)

                  addSpace(root, 20)

                  // HISTORY

                  root.addView(
                      sectionTitle(
                          "📜 RECENT ROUNDS"
                      )
                  )

                  val historyCard = card()

                  historyText = TextView(this).apply {
                      text = "No completed rounds recorded."
                      textSize = 16f
                      setTextColor(Color.LTGRAY)
                      setPadding(0, 4, 0, 4)
                      setLineSpacing(4f, 1f)
                  }

                  historyCard.addView(
                      historyText,
                      matchParams()
                  )

                  root.addView(historyCard)

                  addSpace(root, 10)

                  val clearButton =
                      secondaryButton(
                          "CLEAR HISTORY"
                      )

                  clearButton.setOnClickListener {
                      clearHistory()
                  }

                  root.addView(clearButton)

                  addSpace(root, 22)

                  // FAIRNESS VERIFIER

                  root.addView(
                      sectionTitle(
                          "🔐 PROVABLY FAIR VERIFIER"
                      )
                  )

                  val verifierCard = card()

                  val verifierInfo = TextView(this).apply {
                      text =
                          "Use the revealed server seed and " +
                          "the published SHA-256 commitment to " +
                          "verify completed data."
                      textSize = 14f
                      setTextColor(Color.GRAY)
                      setPadding(0, 0, 0, 12)
                  }

                  verifierCard.addView(
                      verifierInfo,
                      matchParams()
                  )

                  serverSeed =
                      createInput(
                          "Revealed Server Seed"
                      )

                  verifierCard.addView(serverSeed)

                  expectedHash =
                      createInput(
                          "Server Seed SHA-256"
                      )

                  verifierCard.addView(expectedHash)

                  clientSeed =
                      createInput(
                          "Client Seed (optional)"
                      )

                  verifierCard.addView(clientSeed)

                  val verifyButton =
                      primaryButton(
                          "VERIFY SERVER SEED"
                      )

                  verifyButton.setOnClickListener {
                      verifyServerSeed()
                  }

                  verifierCard.addView(verifyButton)

                  verificationResult =
                      TextView(this).apply {
                          text =
                              "Verification waiting..."
                          textSize = 16f
                          setTextColor(Color.LTGRAY)
                          gravity = Gravity.CENTER
                          setPadding(
                              0,
                              18,
                              0,
                              5
                          )
                      }

                  verifierCard.addView(
                      verificationResult,
                      matchParams()
                  )

                  root.addView(verifierCard)

                  addSpace(root, 22)

                  // ANALYTICS

                  root.addView(
                      sectionTitle(
                          "🧠 ANALYTICS ENGINE"
                      )
                  )

                  val analytics = card()

                  val analyticsText =
                      TextView(this).apply {
                          text =
                              "AviatorX analyzes completed " +
                              "round history.\n\n" +
                              "• Round count\n" +
                              "• Average multiplier\n" +
                              "• Lowest multiplier\n" +
                              "• Highest multiplier\n" +
                              "• Distribution ranges\n\n" +
                              "Analytics describe historical data. " +
                              "They do not guarantee future results."
                          textSize = 14f
                          setTextColor(Color.LTGRAY)
                          setLineSpacing(
                              3f,
                              1f
                          )
                      }

                  analytics.addView(
                      analyticsText,
                      matchParams()
                  )

                  root.addView(analytics)

                  addSpace(root, 24)

                  // WARNING

                  val warning = TextView(this).apply {
                      text =
                          "⚠️ RESPONSIBLE USE\n\n" +
                          "AviatorX does not know the next " +
                          "crash multiplier. Provably Fair " +
                          "verification checks data after it is " +
                          "available. Historical patterns are not " +
                          "guaranteed predictions.\n\n" +
                          "This application does not connect to " +
                          "or control your betting account."
                      textSize = 13f
                      setTextColor(Color.GRAY)
                      gravity = Gravity.CENTER
                      setPadding(8, 10, 8, 10)
                      setLineSpacing(
                          3f,
                          1f
                      )
                  }

                  root.addView(
                      warning,
                      matchParams()
                  )

                  val footer = TextView(this).apply {
                      text =
                          "\nAVIATORX AI  •  VERSION 2.1"
                      textSize = 12f
                      setTextColor(Color.DKGRAY)
                      gravity = Gravity.CENTER
                  }

                  root.addView(
                      footer,
                      matchParams()
                  )

                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun card(): LinearLayout {

                  return LinearLayout(this).apply {
                      orientation =
                          LinearLayout.VERTICAL
                      setPadding(18, 18, 18, 18)
                      background =
                          getDrawable(
                              com.aviatorx.predictor.R.drawable.card_background
                          )

                      layoutParams =
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(
                                  0,
                                  4,
                                  0,
                                  4
                              )
                          }
                  }
              }

              private fun metricCard(
                  title: String,
                  value: TextView
              ): LinearLayout {

                  val box = card()

                  val label =
                      TextView(this).apply {
                          text = title
                          textSize = 11f
                          setTextColor(Color.GRAY)
                          gravity = Gravity.CENTER
                      }

                  box.addView(
                      label,
                      matchParams()
                  )

                  value.gravity = Gravity.CENTER

                  box.addView(
                      value,
                      matchParams()
                  )

                  return box
              }

              private fun dashboardValue(
                  initial: String
              ): TextView {

                  return TextView(this).apply {
                      text = initial
                      textSize = 24f
                      setTextColor(Color.WHITE)
                      typeface =
                          android.graphics.Typeface.DEFAULT_BOLD
                      setPadding(
                          0,
                          8,
                          0,
                          2
                      )
                  }
              }

              private fun sectionTitle(
                  textValue: String
              ): TextView {

                  return TextView(this).apply {
                      text = textValue
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      typeface =
                          android.graphics.Typeface.DEFAULT_BOLD
                      setPadding(
                          3,
                          5,
                          3,
                          10
                      )
                  }
              }

              private fun createInput(
                  hintText: String
              ): EditText {

                  return EditText(this).apply {

                      hint = hintText

                      textSize = 15f

                      setTextColor(Color.WHITE)

                      setHintTextColor(
                          Color.rgb(
                              120,
                              120,
                              120
                          )
                      )

                      background =
                          getDrawable(
                              com.aviatorx.predictor.R.drawable.input_background
                          )

                      layoutParams =
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              58
                          ).apply {
                              setMargins(
                                  0,
                                  5,
                                  0,
                                  8
                              )
                          }
                  }
              }

              private fun primaryButton(
                  label: String
              ): Button {

                  return Button(this).apply {

                      text = label

                      textSize = 14f

                      setTextColor(Color.WHITE)

                      isAllCaps = false

                      layoutParams =
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              58
                          ).apply {
                              setMargins(
                                  0,
                                  8,
                                  0,
                                  5
                              )
                          }
                  }
              }

              private fun secondaryButton(
                  label: String
              ): Button {

                  return Button(this).apply {

                      text = label

                      textSize = 13f

                      setTextColor(Color.LTGRAY)

                      isAllCaps = false

                      layoutParams =
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              55
                          )
                  }
              }

              private fun matchParams():
                      LinearLayout.LayoutParams {

                  return LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
              }

              private fun weightParams():
                      LinearLayout.LayoutParams {

                  return LinearLayout.LayoutParams(
                      0,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      1f
                  ).apply {
                      setMargins(
                          4,
                          0,
                          4,
                          0
                      )
                  }
              }

              private fun addSpace(
                  root: LinearLayout,
                  height: Int
              ) {

                  val space = View(this)

                  root.addView(
                      space,
                      LinearLayout.LayoutParams(
                          1,
                          height
                      )
                  )
              }

              private fun sha256(
                  input: String
              ): String {

                  val digest =
                      MessageDigest.getInstance(
                          "SHA-256"
                      )

                  val bytes =
                      digest.digest(
                          input.toByteArray(
                              Charsets.UTF_8
                          )
                      )

                  return bytes.joinToString("") {
                      "%02x".format(it)
                  }
              }

              private fun verifyServerSeed() {

                  val seed =
                      serverSeed.text
                          .toString()
                          .trim()

                  val expected =
                      expectedHash.text
                          .toString()
                          .trim()
                          .lowercase(
                              Locale.US
                          )

                  if (seed.isEmpty()) {

                      showMessage(
                          "Enter the revealed server seed."
                      )

                      return
                  }

                  if (expected.isEmpty()) {

                      showMessage(
                          "Enter the SHA-256 hash."
                      )

                      return
                  }

                  if (
                      expected.length != 64 ||
                      !expected.matches(
                          Regex(
                              "[0-9a-fA-F]{64}"
                          )
                      )
                  ) {

                      verificationResult.text =
                          "❌ INVALID SHA-256 HASH\n\n" +
                          "SHA-256 requires 64 hexadecimal characters."

                      verificationResult.setTextColor(
                          Color.RED
                      )

                      return
                  }

                  val calculated =
                      sha256(seed)

                  if (
                      calculated == expected
                  ) {

                      verificationResult.text =
                          "✅ VERIFIED\n\n" +
                          "Server seed matches the published " +
                          "SHA-256 commitment."

                      verificationResult.setTextColor(
                          Color.GREEN
                      )

                  } else {

                      verificationResult.text =
                          "❌ NOT VERIFIED\n\n" +
                          "Server seed does not match the " +
                          "published SHA-256 commitment."

                      verificationResult.setTextColor(
                          Color.RED
                      )
                  }
              }

              private fun addRound() {

                  val raw =
                      multiplierInput.text
                          .toString()
                          .trim()

                  if (raw.isEmpty()) {

                      showMessage(
                          "Enter a completed multiplier."
                      )

                      return
                  }

                  val value =
                      raw
                          .replace(
                              "x",
                              "",
                              true
                          )
                          .toDoubleOrNull()

                  if (
                      value == null ||
                      value < 1.0
                  ) {

                      showMessage(
                          "Example: 2.35"
                      )

                      return
                  }

                  val prefs =
                      getSharedPreferences(
                          prefsName,
                          Context.MODE_PRIVATE
                      )

                  val existing =
                      prefs.getString(
                          historyKey,
                          ""
                      ) ?: ""

                  val formatted =
                      "%.2f".format(
                          Locale.US,
                          value
                      )

                  val updated =
                      if (existing.isEmpty()) {
                          formatted
                      } else {
                          existing +
                                  "," +
                                  formatted
                      }

                  prefs.edit()
                      .putString(
                          historyKey,
                          updated
                      )
                      .apply()

                  multiplierInput.text.clear()

                  updateDashboard()

                  showMessage(
                      "Round added successfully."
                  )
              }

              private fun updateDashboard() {

                  val prefs =
                      getSharedPreferences(
                          prefsName,
                          Context.MODE_PRIVATE
                      )

                  val stored =
                      prefs.getString(
                          historyKey,
                          ""
                      ) ?: ""

                  val rounds =
                      stored
                          .split(",")
                          .mapNotNull {
                              it.toDoubleOrNull()
                          }

                  if (rounds.isEmpty()) {

                      roundsValue.text = "0"
                      averageValue.text = "--"
                      lowestValue.text = "--"
                      highestValue.text = "--"

                      historyText.text =
                          "No completed rounds recorded."

                      return
                  }

                  roundsValue.text =
                      rounds.size.toString()

                  val average =
                      rounds.average()

                  val lowest =
                      rounds.minOrNull()
                          ?: 0.0

                  val highest =
                      rounds.maxOrNull()
                          ?: 0.0

                  averageValue.text =
                      "%.2fx".format(
                          Locale.US,
                          average
                      )

                  lowestValue.text =
                      "%.2fx".format(
                          Locale.US,
                          lowest
                      )

                  highestValue.text =
                      "%.2fx".format(
                          Locale.US,
                          highest
                      )

                  val recent =
                      rounds
                          .takeLast(30)
                          .reversed()

                  val display =
                      recent
                          .mapIndexed {
                                  index,
                                  number ->

                              "%02d   %.2fx".format(
                                  Locale.US,
                                  index + 1,
                                  number
                              )
                          }
                          .joinToString("\n")

                  historyText.text =
                      display
              }

              private fun clearHistory() {

                  getSharedPreferences(
                      prefsName,
                      Context.MODE_PRIVATE
                  )
                      .edit()
                      .remove(historyKey)
                      .apply()

                  updateDashboard()

                  verificationResult.text =
                      "Verification waiting..."

                  verificationResult.setTextColor(
                      Color.LTGRAY
                  )

                  showMessage(
                      "Round history cleared."
                  )
              }

              private fun showMessage(
                  message: String
              ) {

                  Toast.makeText(
                      this,
                      message,
                      Toast.LENGTH_SHORT
                  ).show()
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

      - name: Create Gradle wrapper
        run: |
          ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AviatorX-AI-V2.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
