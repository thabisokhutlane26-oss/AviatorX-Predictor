name: Build AviatorX AI V3 Professional

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build AviatorX AI V3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf app

          mkdir -p app/src/main/java/com/aviatorx/predictor
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AviatorX-Predictor"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aviatorx.predictor'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aviatorx.predictor'
                  minSdk 23
                  targetSdk 35
                  versionCode 30
                  versionName '3.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="yellow">#FFD600</color>
              <color name="dark_bg">#090B10</color>
              <color name="card_bg">#121722</color>
              <color name="green">#00E676</color>
              <color name="red">#FF5252</color>
              <color name="gray">#9AA4B2</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@color/black</item>
                  <item name="android:navigationBarColor">@color/black</item>
                  <item name="android:colorAccent">@color/yellow</item>
                  <item name="android:windowBackground">@color/dark_bg</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/card_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/card_bg"/>
              <corners android:radius="18dp"/>
              <padding
                  android:left="16dp"
                  android:top="16dp"
                  android:right="16dp"
                  android:bottom="16dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/input_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1A202C"/>
              <stroke
                  android:width="1dp"
                  android:color="#303847"/>
              <corners android:radius="12dp"/>
              <padding
                  android:left="14dp"
                  android:top="4dp"
                  android:right="14dp"
                  android:bottom="4dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/button_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@color/yellow"/>
              <corners android:radius="12dp"/>
              <padding
                  android:left="18dp"
                  android:top="12dp"
                  android:right="18dp"
                  android:bottom="12dp"/>
          </shape>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="AviatorX AI"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/aviatorx/predictor/MainActivity.kt <<'EOF'
          package com.aviatorx.predictor

          import android.content.Context
          import android.graphics.Color
          import android.os.Bundle
          import android.view.ViewGroup
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import java.security.MessageDigest
          import java.util.Locale
          import kotlin.math.sqrt

          class MainActivity : AppCompatActivity() {

              private lateinit var historyText: TextView
              private lateinit var statsText: TextView
              private lateinit var analyticsText: TextView
              private lateinit var statusText: TextView
              private lateinit var roundInput: EditText
              private lateinit var windowSpinner: Spinner

              private val rounds = mutableListOf<Double>()

              private val prefsName = "aviatorx_data"
              private val roundsKey = "rounds"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  loadHistory()
                  buildInterface()
                  refreshDashboard()
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun textView(
                  value: String,
                  size: Float,
                  bold: Boolean = false
              ): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(Color.WHITE)

                      if (bold) {
                          setTypeface(
                              null,
                              android.graphics.Typeface.BOLD
                          )
                      }

                      setPadding(
                          dp(4),
                          dp(4),
                          dp(4),
                          dp(4)
                      )
                  }
              }

              private fun card(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL

                      setPadding(
                          dp(16),
                          dp(16),
                          dp(16),
                          dp(16)
                      )

                      setBackgroundResource(
                          R.drawable.card_background
                      )

                      val params = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )

                      params.setMargins(
                          dp(8),
                          dp(8),
                          dp(8),
                          dp(8)
                      )

                      layoutParams = params
                  }
              }

              private fun buildInterface() {

                  val scroll = ScrollView(this)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL

                      setPadding(
                          dp(10),
                          dp(10),
                          dp(10),
                          dp(20)
                      )

                      setBackgroundColor(
                          Color.rgb(9, 11, 16)
                      )
                  }

                  scroll.addView(root)

                  val header = card()

                  val title = textView(
                      "✈ AVIATORX AI",
                      30f,
                      true
                  )

                  title.setTextColor(
                      Color.rgb(255, 214, 0)
                  )

                  header.addView(title)

                  header.addView(
                      textView(
                          "PROFESSIONAL ANALYTICS • V3.0",
                          13f,
                          true
                      )
                  )

                  statusText = textView(
                      "● SYSTEM READY",
                      13f,
                      true
                  )

                  statusText.setTextColor(
                      Color.rgb(0, 230, 118)
                  )

                  header.addView(statusText)

                  val owner = textView(
                      "Made by Thabiso Khutlane",
                      12f
                  )

                  owner.setTextColor(
                      Color.rgb(154, 164, 178)
                  )

                  header.addView(owner)

                  root.addView(header)

                  val overview = card()

                  overview.addView(
                      textView(
                          "PERFORMANCE OVERVIEW",
                          18f,
                          true
                      )
                  )

                  statsText = textView("", 15f)
                  overview.addView(statsText)

                  root.addView(overview)

                  val entryCard = card()

                  entryCard.addView(
                      textView(
                          "MANUAL ROUND ENTRY",
                          18f,
                          true
                      )
                  )

                  entryCard.addView(
                      textView(
                          "Enter a completed Aviator multiplier.",
                          13f
                      )
                  )

                  roundInput = EditText(this).apply {
                      hint = "Example: 2.45"
                      setTextColor(Color.WHITE)
                      setHintTextColor(
                          Color.rgb(154, 164, 178)
                      )

                      inputType =
                          android.text.InputType.TYPE_CLASS_NUMBER or
                          android.text.InputType.TYPE_NUMBER_FLAG_DECIMAL

                      setBackgroundResource(
                          R.drawable.input_background
                      )
                  }

                  val inputParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      dp(58)
                  )

                  inputParams.setMargins(
                      0,
                      dp(12),
                      0,
                      dp(12)
                  )

                  entryCard.addView(
                      roundInput,
                      inputParams
                  )

                  val addButton = Button(this).apply {
                      text = "ADD COMPLETED ROUND"
                      setTextColor(Color.BLACK)

                      setTypeface(
                          null,
                          android.graphics.Typeface.BOLD
                      )

                      setBackgroundResource(
                          R.drawable.button_background
                      )

                      setOnClickListener {
                          addRound()
                      }
                  }

                  entryCard.addView(addButton)

                  val clearButton = Button(this).apply {
                      text = "CLEAR HISTORY"

                      setOnClickListener {
                          clearHistory()
                      }
                  }

                  entryCard.addView(clearButton)

                  root.addView(entryCard)

                  val analyticsCard = card()

                  analyticsCard.addView(
                      textView(
                          "ADVANCED ANALYTICS",
                          18f,
                          true
                      )
                  )

                  analyticsCard.addView(
                      textView(
                          "Analysis is based only on rounds you enter.",
                          13f
                      )
                  )

                  windowSpinner = Spinner(this)

                  val windows = arrayOf(
                      "Last 10 rounds",
                      "Last 25 rounds",
                      "Last 50 rounds",
                      "Last 100 rounds"
                  )

                  val adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      windows
                  )

                  windowSpinner.adapter = adapter

                  analyticsCard.addView(
                      windowSpinner,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(55)
                      )
                  )

                  analyticsText = textView("", 14f)

                  analyticsCard.addView(
                      analyticsText
                  )

                  windowSpinner.onItemSelectedListener =
                      object : AdapterView.OnItemSelectedListener {

                          override fun onNothingSelected(
                              parent: AdapterView<*>?
                          ) {
                              refreshDashboard()
                          }

                          override fun onItemSelected(
                              parent: AdapterView<*>?,
                              view: android.view.View?,
                              position: Int,
                              id: Long
                          ) {
                              refreshDashboard()
                          }
                      }

                  root.addView(analyticsCard)

                  val recentCard = card()

                  recentCard.addView(
                      textView(
                          "RECENT ROUNDS",
                          18f,
                          true
                      )
                  )

                  historyText = textView(
                      "No rounds entered.",
                      14f
                  )

                  recentCard.addView(historyText)

                  root.addView(recentCard)

                  val fairCard = card()

                  fairCard.addView(
                      textView(
                          "PROVABLY FAIR VERIFIER",
                          18f,
                          true
                      )
                  )

                  fairCard.addView(
                      textView(
                          "Verify a revealed server seed against its SHA-256 hash.",
                          13f
                      )
                  )

                  val serverSeedInput = EditText(this).apply {
                      hint = "Server seed"
                      setTextColor(Color.WHITE)
                      setHintTextColor(
                          Color.rgb(154, 164, 178)
                      )
                      setBackgroundResource(
                          R.drawable.input_background
                      )
                  }

                  fairCard.addView(serverSeedInput)

                  val expectedHashInput = EditText(this).apply {
                      hint = "Expected SHA-256 hash"
                      setTextColor(Color.WHITE)
                      setHintTextColor(
                          Color.rgb(154, 164, 178)
                      )
                      setBackgroundResource(
                          R.drawable.input_background
                      )
                  }

                  fairCard.addView(expectedHashInput)

                  val verifyButton = Button(this).apply {

                      text = "VERIFY SHA-256"

                      setOnClickListener {

                          val seed =
                              serverSeedInput.text
                                  .toString()
                                  .trim()

                          val expected =
                              expectedHashInput.text
                                  .toString()
                                  .trim()
                                  .lowercase(Locale.US)

                          if (seed.isEmpty()) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "Enter the server seed.",
                                  Toast.LENGTH_SHORT
                              ).show()
                              return@setOnClickListener
                          }

                          if (!expected.matches(
                                  Regex("[0-9a-f]{64}")
                              )
                          ) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "Hash must contain 64 hexadecimal characters.",
                                  Toast.LENGTH_LONG
                              ).show()
                              return@setOnClickListener
                          }

                          val actual = sha256(seed)

                          if (actual == expected) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "✓ HASH VERIFIED",
                                  Toast.LENGTH_LONG
                              ).show()
                          } else {
                              Toast.makeText(
                                  this@MainActivity,
                                  "✕ HASH DOES NOT MATCH",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }
                  }

                  fairCard.addView(verifyButton)

                  root.addView(fairCard)

                  val warningCard = card()

                  val warning = textView(
                      "⚠ RESPONSIBLE USE\n\n" +
                      "AviatorX AI analyses historical data entered by you. " +
                      "It does not know or guarantee the next multiplier. " +
                      "Past results do not guarantee future results. " +
                      "Never risk money you cannot afford to lose.",
                      14f,
                      true
                  )

                  warning.setTextColor(
                      Color.rgb(255, 214, 0)
                  )

                  warningCard.addView(warning)

                  root.addView(warningCard)

                  setContentView(scroll)
              }

              private fun addRound() {

                  val valueText =
                      roundInput.text
                          .toString()
                          .trim()

                  val value =
                      valueText.toDoubleOrNull()

                  if (
                      value == null ||
                      value < 1.0 ||
                      value > 1_000_000.0
                  ) {
                      Toast.makeText(
                          this,
                          "Enter a valid multiplier from 1.00 to 1,000,000.",
                          Toast.LENGTH_LONG
                      ).show()

                      return
                  }

                  rounds.add(value)

                  saveHistory()

                  roundInput.text.clear()

                  Toast.makeText(
                      this,
                      "Round added: ${formatMultiplier(value)}x",
                      Toast.LENGTH_SHORT
                  ).show()

                  refreshDashboard()
              }

              private fun refreshDashboard() {

                  val count = rounds.size

                  if (count == 0) {

                      statsText.text =
                          "Rounds recorded: 0\n\n" +
                          "Add completed rounds to activate analytics."

                      analyticsText.text =
                          "Waiting for historical data..."

                      historyText.text =
                          "No rounds entered."

                      return
                  }

                  val average =
                      rounds.average()

                  val lowest =
                      rounds.minOrNull() ?: 0.0

                  val highest =
                      rounds.maxOrNull() ?: 0.0

                  statsText.text =
                      "Rounds recorded: $count\n" +
                      "Average: ${formatMultiplier(average)}x\n" +
                      "Lowest: ${formatMultiplier(lowest)}x\n" +
                      "Highest: ${formatMultiplier(highest)}x"

                  val requestedWindow =
                      when (windowSpinner.selectedItemPosition) {
                          0 -> 10
                          1 -> 25
                          2 -> 50
                          else -> 100
                      }

                  val data =
                      rounds.takeLast(requestedWindow)

                  analyticsText.text =
                      calculateAnalytics(data)

                  val recent =
                      rounds.takeLast(20).reversed()

                  val builder =
                      StringBuilder()

                  recent.forEachIndexed { index, value ->

                      builder.append(
                          "${index + 1}. ${formatMultiplier(value)}x"
                      )

                      if (index < recent.lastIndex) {
                          builder.append("\n")
                      }
                  }

                  historyText.text =
                      builder.toString()

                  statusText.text =
                      "● SYSTEM READY • ${count} ROUNDS LOADED"
              }

              private fun calculateAnalytics(
                  data: List<Double>
              ): String {

                  if (data.isEmpty()) {
                      return "No data available."
                  }

                  val average =
                      data.average()

                  val sorted =
                      data.sorted()

                  val median =
                      if (sorted.size % 2 == 0) {
                          (
                              sorted[sorted.size / 2 - 1] +
                              sorted[sorted.size / 2]
                          ) / 2.0
                      } else {
                          sorted[sorted.size / 2]
                      }

                  val variance =
                      data.map {
                          val difference =
                              it - average

                          difference * difference
                      }.average()

                  val volatility =
                      sqrt(variance)

                  val under120 =
                      data.count { it < 1.20 }

                  val from120to2 =
                      data.count {
                          it >= 1.20 && it < 2.0
                      }

                  val from2to5 =
                      data.count {
                          it >= 2.0 && it < 5.0
                      }

                  val from5to10 =
                      data.count {
                          it >= 5.0 && it < 10.0
                      }

                  val above10 =
                      data.count {
                          it >= 10.0
                      }

                  fun percentage(
                      value: Int
                  ): String {
                      return String.format(
                          Locale.US,
                          "%.1f%%",
                          value * 100.0 / data.size
                      )
                  }

                  return buildString {

                      append(
                          "Window: ${data.size} rounds\n\n"
                      )

                      append(
                          "Mean: ${formatMultiplier(average)}x\n"
                      )

                      append(
                          "Median: ${formatMultiplier(median)}x\n"
                      )

                      append(
                          "Volatility: ${
                              String.format(
                                  Locale.US,
                                  "%.2f",
                                  volatility
                              )
                          }\n\n"
                      )

                      append("Distribution\n")

                      append(
                          "< 1.20x: ${percentage(under120)}\n"
                      )

                      append(
                          "1.20x – 2x: ${percentage(from120to2)}\n"
                      )

                      append(
                          "2x – 5x: ${percentage(from2to5)}\n"
                      )

                      append(
                          "5x – 10x: ${percentage(from5to10)}\n"
                      )

                      append(
                          "10x+: ${percentage(above10)}\n"
                      )

                      append(
                          "\nHistorical analysis only — " +
                          "not a guaranteed prediction."
                      )
                  }
              }

              private fun formatMultiplier(
                  value: Double
              ): String {

                  return String.format(
                      Locale.US,
                      "%.2f",
                      value
                  )
              }

              private fun sha256(
                  input: String
              ): String {

                  val digest =
                      MessageDigest.getInstance(
                          "SHA-256"
                      )

                  val bytes =
                      digest.digest(
                          input.toByteArray(
                              Charsets.UTF_8
                          )
                      )

                  return bytes.joinToString("") {
                      "%02x".format(it)
                  }
              }

              private fun saveHistory() {

                  val encoded =
                      rounds.joinToString(",")

                  getSharedPreferences(
                      prefsName,
                      Context.MODE_PRIVATE
                  )
                      .edit()
                      .putString(
                          roundsKey,
                          encoded
                      )
                      .apply()
              }

              private fun loadHistory() {

                  val saved =
                      getSharedPreferences(
                          prefsName,
                          Context.MODE_PRIVATE
                      )
                      .getString(
                          roundsKey,
                          ""
                      ) ?: ""

                  if (saved.isEmpty()) {
                      return
                  }

                  saved.split(",").forEach { item ->

                      val value =
                          item.toDoubleOrNull()

                      if (
                          value != null &&
                          value >= 1.0
                      ) {
                          rounds.add(value)
                      }
                  }
              }

              private fun clearHistory() {

                  rounds.clear()

                  getSharedPreferences(
                      prefsName,
                      Context.MODE_PRIVATE
                  )
                      .edit()
                      .remove(roundsKey)
                      .apply()

                  refreshDashboard()

                  Toast.makeText(
                      this,
                      "History cleared.",
                      Toast.LENGTH_SHORT
                  ).show()
              }
          }
          EOF

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AviatorX-AI-V3.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
