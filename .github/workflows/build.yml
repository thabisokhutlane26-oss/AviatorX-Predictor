name: Build AviatorX Predictor

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create project
        run: |

          mkdir -p app/src/main/java/com/aviatorx/predictor
          mkdir -p app/src/main/res/values

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AviatorXPredictor"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aviatorx.predictor'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aviatorx.predictor'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="AviatorX Predictor"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="Theme.MaterialComponents.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/aviatorx/predictor/MainActivity.kt <<'EOF'
          package com.aviatorx.predictor

          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import kotlin.random.Random

          class MainActivity : AppCompatActivity() {

              private lateinit var prediction: TextView
              private lateinit var confidence: TextView
              private lateinit var signal: TextView

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(30, 40, 30, 40)
                      setBackgroundColor(Color.BLACK)
                  }

                  val title = TextView(this).apply {
                      text = "✈️ AviatorX"
                      textSize = 32f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }

                  root.addView(title)

                  val subtitle = TextView(this).apply {
                      text = "PREDICTOR"
                      textSize = 20f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 5, 0, 35)
                  }

                  root.addView(subtitle)

                  prediction = TextView(this).apply {
                      text = "2.00x"
                      textSize = 52f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 30, 0, 30)
                  }

                  root.addView(
                      prediction,
                      LinearLayout.LayoutParams(
                          -1,
                          160
                      )
                  )

                  confidence = TextView(this).apply {
                      text = "Confidence: --"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 20, 0, 20)
                  }

                  root.addView(confidence)

                  signal = TextView(this).apply {
                      text = "Signal: READY"
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 20, 0, 30)
                  }

                  root.addView(signal)

                  val button = Button(this).apply {
                      text = "GENERATE ESTIMATE"
                      textSize = 16f

                      setOnClickListener {

                          val value =
                              Random.nextDouble(1.10, 8.00)

                          val percent =
                              Random.nextInt(55, 91)

                          val level =
                              when {
                                  value < 1.50 -> "LOW"
                                  value < 3.00 -> "MEDIUM"
                                  else -> "HIGH"
                              }

                          prediction.text =
                              String.format(
                                  "%.2fx",
                                  value
                              )

                          confidence.text =
                              "Confidence: $percent%"

                          signal.text =
                              "Signal: $level"
                      }
                  }

                  root.addView(
                      button,
                      LinearLayout.LayoutParams(
                          -1,
                          60
                      )
                  )

                  val warning = TextView(this).apply {
                      text =
                          "\n⚠️ Experimental tool\n\n" +
                          "This app cannot know the next Aviator result. " +
                          "These estimates are not guaranteed predictions. " +
                          "Use responsibly."
                      textSize = 14f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(10, 30, 10, 10)
                  }

                  root.addView(warning)

                  scroll.addView(root)

                  setContentView(scroll)
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

      - name: Create Gradle wrapper
        run: |
          ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AviatorX-Predictor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
