name: Build AviatorX Predictor

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create project
        run: |

          mkdir -p app/src/main/java/com/aviatorx/predictor
          mkdir -p app/src/main/res/values

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AviatorXPredictor"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aviatorx.predictor'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aviatorx.predictor'
                  minSdk 24
                  targetSdk 35
                  versionCode 2
                  versionName "2.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="AviatorX Predictor"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="Theme.MaterialComponents.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:colorAccent">#FF3B30</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/aviatorx/predictor/MainActivity.kt <<'EOF'
          package com.aviatorx.predictor

          import android.content.Context
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import java.security.MessageDigest
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var serverSeed: EditText
              private lateinit var expectedHash: EditText
              private lateinit var clientSeed: EditText
              private lateinit var multiplierInput: EditText

              private lateinit var verificationResult: TextView
              private lateinit var statistics: TextView
              private lateinit var historyText: TextView

              private val prefsName = "aviator_history"
              private val historyKey = "rounds"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  buildInterface()
                  updateHistory()
              }

              private fun buildInterface() {

                  val scroll = ScrollView(this)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(28, 35, 28, 35)
                      setBackgroundColor(Color.BLACK)
                  }

                  val title = TextView(this).apply {
                      text = "✈️ AviatorX"
                      textSize = 32f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                  }

                  root.addView(
                      title,
                      matchParams()
                  )

                  val version = TextView(this).apply {
                      text = "PROVABLY FAIR ANALYZER • V2.0"
                      textSize = 14f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 8, 0, 25)
                  }

                  root.addView(
                      version,
                      matchParams()
                  )

                  val status = TextView(this).apply {
                      text = "🟡 VERIFIED DATA MODE"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(15, 20, 15, 20)
                  }

                  root.addView(
                      status,
                      matchParams()
                  )

                  val info = TextView(this).apply {
                      text =
                          "Verify completed Aviator rounds using the " +
                          "server-seed SHA-256 commitment.\n\n" +
                          "This app does NOT claim to predict the next crash."
                      textSize = 15f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(10, 10, 10, 25)
                  }

                  root.addView(
                      info,
                      matchParams()
                  )

                  serverSeed = createInput(
                      "Revealed Server Seed"
                  )

                  root.addView(serverSeed)

                  expectedHash = createInput(
                      "Server Seed SHA-256"
                  )

                  root.addView(expectedHash)

                  clientSeed = createInput(
                      "Client Seed (optional)"
                  )

                  root.addView(clientSeed)

                  multiplierInput = createInput(
                      "Completed Multiplier e.g. 2.35"
                  )

                  root.addView(multiplierInput)

                  val verifyButton = Button(this).apply {
                      text = "🔐 VERIFY SERVER SEED"
                      textSize = 16f

                      setOnClickListener {
                          verifyServerSeed()
                      }
                  }

                  root.addView(
                      verifyButton,
                      buttonParams()
                  )

                  verificationResult = TextView(this).apply {
                      text = "Verification waiting..."
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(10, 25, 10, 25)
                  }

                  root.addView(
                      verificationResult,
                      matchParams()
                  )

                  val addButton = Button(this).apply {
                      text = "➕ ADD COMPLETED ROUND"
                      textSize = 16f

                      setOnClickListener {
                          addRound()
                      }
                  }

                  root.addView(
                      addButton,
                      buttonParams()
                  )

                  val statsTitle = TextView(this).apply {
                      text = "\n📊 ROUND STATISTICS"
                      textSize = 21f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 25, 0, 15)
                  }

                  root.addView(
                      statsTitle,
                      matchParams()
                  )

                  statistics = TextView(this).apply {
                      text = "No completed rounds recorded."
                      textSize = 16f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(10, 10, 10, 25)
                  }

                  root.addView(
                      statistics,
                      matchParams()
                  )

                  val historyTitle = TextView(this).apply {
                      text = "📜 ROUND HISTORY"
                      textSize = 21f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 20, 0, 15)
                  }

                  root.addView(
                      historyTitle,
                      matchParams()
                  )

                  historyText = TextView(this).apply {
                      text = "No history yet."
                      textSize = 15f
                      setTextColor(Color.LTGRAY)
                      setPadding(10, 10, 10, 20)
                  }

                  root.addView(
                      historyText,
                      matchParams()
                  )

                  val clearButton = Button(this).apply {
                      text = "🗑 CLEAR ROUND HISTORY"
                      textSize = 15f

                      setOnClickListener {
                          clearHistory()
                      }
                  }

                  root.addView(
                      clearButton,
                      buttonParams()
                  )

                  val warning = TextView(this).apply {
                      text =
                          "\n⚠️ IMPORTANT\n\n" +
                          "Provably Fair verification checks completed " +
                          "round data. It cannot reveal or predict a future " +
                          "crash multiplier.\n\n" +
                          "Never treat historical patterns as guaranteed " +
                          "signals for gambling."
                      textSize = 14f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(10, 30, 10, 20)
                  }

                  root.addView(
                      warning,
                      matchParams()
                  )

                  scroll.addView(root)

                  setContentView(scroll)
              }

              private fun createInput(hint: String): EditText {

                  return EditText(this).apply {
                      this.hint = hint
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                      setPadding(20, 15, 20, 15)

                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply {
                          setMargins(0, 8, 0, 8)
                      }

                      background =
                          getDrawable(
                              android.R.drawable.edit_text
                          )
                  }
              }

              private fun matchParams(): LinearLayout.LayoutParams {
                  return LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
              }

              private fun buttonParams(): LinearLayout.LayoutParams {
                  return LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      65
                  ).apply {
                      setMargins(0, 10, 0, 10)
                  }
              }

              private fun verifyServerSeed() {

                  val seed =
                      serverSeed.text.toString().trim()

                  val expected =
                      expectedHash.text.toString()
                          .trim()
                          .lowercase(Locale.US)

                  if (seed.isEmpty()) {
                      showMessage(
                          "Enter the revealed server seed."
                      )
                      return
                  }

                  if (expected.isEmpty()) {
                      showMessage(
                          "Enter the server seed SHA-256 hash."
                      )
                      return
                  }

                  if (expected.length != 64) {
                      verificationResult.text =
                          "❌ INVALID SHA-256\n\n" +
                          "A SHA-256 hash must contain 64 hexadecimal characters."

                      verificationResult.setTextColor(
                          Color.RED
                      )

                      return
                  }

                  val calculated =
                      sha256(seed)

                  if (calculated == expected) {

                      verificationResult.text =
                          "✅ VERIFIED\n\n" +
                          "The revealed server seed matches " +
                          "the SHA-256 commitment."

                      verificationResult.setTextColor(
                          Color.GREEN
                      )

                  } else {

                      verificationResult.text =
                          "❌ NOT VERIFIED\n\n" +
                          "The revealed server seed does not match " +
                          "the supplied SHA-256 commitment."

                      verificationResult.setTextColor(
                          Color.RED
                      )
                  }
              }

              private fun sha256(input: String): String {

                  val digest =
                      MessageDigest.getInstance("SHA-256")

                  val bytes =
                      digest.digest(
                          input.toByteArray(Charsets.UTF_8)
                      )

                  return bytes.joinToString("") {
                      "%02x".format(it)
                  }
              }

              private fun addRound() {

                  val valueText =
                      multiplierInput.text.toString().trim()

                  if (valueText.isEmpty()) {
                      showMessage(
                          "Enter the completed multiplier first."
                      )
                      return
                  }

                  val value =
                      valueText
                          .replace("x", "", true)
                          .toDoubleOrNull()

                  if (value == null || value < 1.0) {
                      showMessage(
                          "Enter a valid multiplier such as 2.35."
                      )
                      return
                  }

                  val prefs =
                      getSharedPreferences(
                          prefsName,
                          Context.MODE_PRIVATE
                      )

                  val current =
                      prefs.getString(
                          historyKey,
                          ""
                      ) ?: ""

                  val newHistory =
                      if (current.isEmpty()) {
                          "%.2f".format(Locale.US, value)
                      } else {
                          current +
                                  "," +
                                  "%.2f".format(
                                      Locale.US,
                                      value
                                  )
                      }

                  prefs.edit()
                      .putString(
                          historyKey,
                          newHistory
                      )
                      .apply()

                  multiplierInput.text.clear()

                  updateHistory()

                  showMessage(
                      "Round added."
                  )
              }

              private fun updateHistory() {

                  val prefs =
                      getSharedPreferences(
                          prefsName,
                          Context.MODE_PRIVATE
                      )

                  val stored =
                      prefs.getString(
                          historyKey,
                          ""
                      ) ?: ""

                  if (stored.isEmpty()) {

                      historyText.text =
                          "No completed rounds recorded."

                      statistics.text =
                          "Rounds: 0\n\n" +
                          "Add completed multipliers to begin analysis."

                      return
                  }

                  val rounds =
                      stored.split(",")
                          .mapNotNull {
                              it.toDoubleOrNull()
                          }

                  if (rounds.isEmpty()) {
                      return
                  }

                  val total =
                      rounds.sum()

                  val average =
                      total / rounds.size

                  val low =
                      rounds.count {
                          it < 2.0
                      }

                  val medium =
                      rounds.count {
                          it >= 2.0 && it < 10.0
                      }

                  val high =
                      rounds.count {
                          it >= 10.0
                      }

                  val highest =
                      rounds.maxOrNull() ?: 0.0

                  val lowest =
                      rounds.minOrNull() ?: 0.0

                  statistics.text =
                      "Rounds recorded: ${rounds.size}\n\n" +
                      "Average: %.2fx\n".format(
                          Locale.US,
                          average
                      ) +
                      "Lowest: %.2fx\n".format(
                          Locale.US,
                          lowest
                      ) +
                      "Highest: %.2fx\n\n".format(
                          Locale.US,
                          highest
                      ) +
                      "Below 2.00x: $low\n" +
                      "2.00x – 9.99x: $medium\n" +
                      "10.00x+: $high"

                  val display =
                      rounds
                          .takeLast(100)
                          .reversed()
                          .mapIndexed { index, number ->
                              "${index + 1}. " +
                                      "%.2fx".format(
                                          Locale.US,
                                          number
                                      )
                          }
                          .joinToString("\n")

                  historyText.text =
                      display
              }

              private fun clearHistory() {

                  getSharedPreferences(
                      prefsName,
                      Context.MODE_PRIVATE
                  )
                      .edit()
                      .remove(historyKey)
                      .apply()

                  updateHistory()

                  verificationResult.text =
                      "Verification waiting..."

                  verificationResult.setTextColor(
                      Color.WHITE
                  )

                  showMessage(
                      "Round history cleared."
                  )
              }

              private fun showMessage(message: String) {

                  Toast.makeText(
                      this,
                      message,
                      Toast.LENGTH_SHORT
                  ).show()
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip

      - name: Create Gradle wrapper
        run: |
          ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AviatorX-Predictor-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
