name: Build AviatorX AI V7 Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build AviatorX AI V7 Final APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create project directories
        run: |
          mkdir -p app/src/main/java/com/aviatorx/predictor
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AviatorX-Predictor"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aviatorx.predictor'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aviatorx.predictor'
                  minSdk 23
                  targetSdk 35
                  versionCode 70
                  versionName '7.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="AviatorX AI"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      - name: Create theme
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07111F</item>
                  <item name="android:navigationBarColor">#050B12</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>

          </resources>
          EOF

      - name: Create app icon
        run: |
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#07111F"
                  android:pathData="M0,0h108v108h-108z" />

              <path
                  android:fillColor="#00E676"
                  android:pathData="M18,66 L45,42 L82,24 L69,46 L89,58 L63,59 L48,78 L45,60 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M45,42 L54,47 L82,24 L63,49 Z" />

          </vector>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/aviatorx/predictor/MainActivity.java <<'EOF'
          package com.aviatorx.predictor;

          import android.Manifest;
          import android.app.Activity;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends AppCompatActivity {

              private static final String PREFS = "aviatorx_v7";
              private static final String DATA_KEY = "rounds";

              private final ArrayList<Round> rounds = new ArrayList<>();
              private SharedPreferences prefs;

              private LinearLayout root;
              private LinearLayout explorerContainer;
              private TextView dashboardText;
              private TextView analyticsText;
              private TextView qualityText;
              private ChartView lineChart;
              private DistributionView distributionChart;

              private Spinner timeframeSpinner;
              private Spinner filterSpinner;
              private Spinner sortSpinner;
              private EditText searchBox;

              private final String[] TIMEFRAMES = {
                      "ALL TIME",
                      "5M",
                      "15M",
                      "30M",
                      "1H",
                      "4H",
                      "1D"
              };

              private final String[] FILTERS = {
                      "ALL",
                      "< 1.20x",
                      "1.20x - 2x",
                      "2x - 5x",
                      "5x - 10x",
                      "10x+"
              };

              private final String[] SORTS = {
                      "NEWEST",
                      "HIGHEST",
                      "LOWEST"
              };

              private ActivityResultLauncher<Intent> exportLauncher;
              private ActivityResultLauncher<Intent> importLauncher;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                  loadRounds();
                  createNotificationChannel();

                  exportLauncher = registerForActivityResult(
                          new ActivityResultContracts.StartActivityForResult(),
                          result -> {
                              if (result.getResultCode() == Activity.RESULT_OK &&
                                      result.getData() != null &&
                                      result.getData().getData() != null) {
                                  exportCsv(result.getData().getData());
                              }
                          });

                  importLauncher = registerForActivityResult(
                          new ActivityResultContracts.StartActivityForResult(),
                          result -> {
                              if (result.getResultCode() == Activity.RESULT_OK &&
                                      result.getData() != null &&
                                      result.getData().getData() != null) {
                                  importCsv(result.getData().getData());
                              }
                          });

                  buildUi();
              }

              private int dp(float value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView text(String value, float size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(0xFFE8F1F8);
                  t.setPadding(dp(12), dp(8), dp(12), dp(8));
                  return t;
              }

              private Button button(String value) {
                  Button b = new Button(this);
                  b.setText(value);
                  b.setTextSize(13);
                  b.setAllCaps(false);
                  return b;
              }

              private LinearLayout card() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(14), dp(14), dp(14), dp(14));
                  box.setBackgroundColor(0xFF101D2B);

                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  p.setMargins(0, dp(8), 0, dp(8));
                  box.setLayoutParams(p);
                  return box;
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(0xFF050B12);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(14), dp(12), dp(14), dp(20));

                  scroll.addView(root);

                  TextView header = text("✈ AVIATORX AI", 28);
                  header.setTextColor(0xFF00E676);
                  header.setGravity(Gravity.CENTER);
                  root.addView(header);

                  TextView sub = text(
                          "V7.0 FINAL • PROFESSIONAL ANALYTICS ENGINE",
                          12);
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub);

                  TextView owner = text(
                          "Built by Thabiso Khutlane • Data-driven • No guaranteed predictions",
                          11);
                  owner.setGravity(Gravity.CENTER);
                  owner.setTextColor(0xFF9FB1C1);
                  root.addView(owner);

                  LinearLayout dashCard = card();
                  dashCard.addView(text("PROFESSIONAL DASHBOARD", 18));

                  dashboardText = text("", 14);
                  dashCard.addView(dashboardText);

                  root.addView(dashCard);

                  LinearLayout timeframeCard = card();
                  timeframeCard.addView(text("ANALYSIS TIMEFRAME", 18));

                  timeframeSpinner = spinner(TIMEFRAMES);
                  timeframeCard.addView(timeframeSpinner);

                  TextView timeframeInfo = text(
                          "Timeframes are analysis labels. V7 never invents live data.",
                          11);
                  timeframeInfo.setTextColor(0xFF9FB1C1);
                  timeframeCard.addView(timeframeInfo);

                  root.addView(timeframeCard);

                  LinearLayout entryCard = card();
                  entryCard.addView(text("ADD COMPLETED ROUND", 18));

                  EditText multiplier = new EditText(this);
                  multiplier.setHint("Multiplier e.g. 1.25");
                  multiplier.setTextColor(0xFFFFFFFF);
                  multiplier.setHintTextColor(0xFF7890A3);
                  multiplier.setInputType(
                          InputType.TYPE_CLASS_NUMBER |
                          InputType.TYPE_NUMBER_FLAG_DECIMAL);
                  entryCard.addView(multiplier);

                  Button add = button("＋ SAVE ROUND");
                  entryCard.addView(add);

                  add.setOnClickListener(v -> {
                      String value = multiplier.getText().toString().trim();

                      try {
                          double m = Double.parseDouble(value);

                          if (m < 1.0 || m > 1000000.0) {
                              Toast.makeText(this,
                                      "Enter a multiplier from 1.00x to 1,000,000x.",
                                      Toast.LENGTH_SHORT).show();
                              return;
                          }

                          String tf = TIMEFRAMES[timeframeSpinner.getSelectedItemPosition()];

                          rounds.add(new Round(m, System.currentTimeMillis(), tf));
                          saveRounds();

                          multiplier.setText("");
                          refreshAll();

                          Toast.makeText(this,
                                  "Round saved.",
                                  Toast.LENGTH_SHORT).show();

                      } catch (Exception e) {
                          Toast.makeText(this,
                                  "Enter a valid multiplier.",
                                  Toast.LENGTH_SHORT).show();
                      }
                  });

                  root.addView(entryCard);

                  LinearLayout chartCard = card();
                  chartCard.addView(text("MULTIPLIER HISTORY", 18));

                  lineChart = new ChartView(this);
                  lineChart.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(240)));
                  chartCard.addView(lineChart);

                  root.addView(chartCard);

                  LinearLayout distributionCard = card();
                  distributionCard.addView(text("MULTIPLIER DISTRIBUTION", 18));

                  distributionChart = new DistributionView(this);
                  distributionChart.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(230)));
                  distributionCard.addView(distributionChart);

                  root.addView(distributionCard);

                  LinearLayout analyticsCard = card();
                  analyticsCard.addView(text("ADVANCED INTELLIGENCE", 18));

                  analyticsText = text("", 13);
                  analyticsCard.addView(analyticsText);

                  root.addView(analyticsCard);

                  LinearLayout explorerCard = card();
                  explorerCard.addView(text("ROUND EXPLORER", 18));

                  searchBox = new EditText(this);
                  searchBox.setHint("Search multiplier or timeframe");
                  searchBox.setTextColor(0xFFFFFFFF);
                  searchBox.setHintTextColor(0xFF7890A3);
                  explorerCard.addView(searchBox);

                  filterSpinner = spinner(FILTERS);
                  explorerCard.addView(filterSpinner);

                  sortSpinner = spinner(SORTS);
                  explorerCard.addView(sortSpinner);

                  explorerContainer = new LinearLayout(this);
                  explorerContainer.setOrientation(LinearLayout.VERTICAL);
                  explorerCard.addView(explorerContainer);

                  Button refreshExplorer = button("REFRESH EXPLORER");
                  explorerCard.addView(refreshExplorer);

                  refreshExplorer.setOnClickListener(v -> refreshExplorer());

                  root.addView(explorerCard);

                  searchBox.setOnEditorActionListener((v, actionId, event) -> {
                      refreshExplorer();
                      return false;
                  });

                  filterSpinner.setOnItemSelectedListener(
                          new android.widget.AdapterView.OnItemSelectedListener() {
                              @Override
                              public void onItemSelected(
                                      android.widget.AdapterView<?> parent,
                                      View view,
                                      int position,
                                      long id) {
                                  refreshExplorer();
                              }

                              @Override
                              public void onNothingSelected(
                                      android.widget.AdapterView<?> parent) {}
                          });

                  sortSpinner.setOnItemSelectedListener(
                          new android.widget.AdapterView.OnItemSelectedListener() {
                              @Override
                              public void onItemSelected(
                                      android.widget.AdapterView<?> parent,
                                      View view,
                                      int position,
                                      long id) {
                                  refreshExplorer();
                              }

                              @Override
                              public void onNothingSelected(
                                      android.widget.AdapterView<?> parent) {}
                          });

                  LinearLayout fairCard = card();
                  fairCard.addView(text("PROVABLY FAIR VERIFIER", 18));

                  EditText serverSeed = new EditText(this);
                  serverSeed.setHint("Revealed server seed");
                  serverSeed.setTextColor(0xFFFFFFFF);
                  serverSeed.setHintTextColor(0xFF7890A3);
                  fairCard.addView(serverSeed);

                  EditText expectedHash = new EditText(this);
                  expectedHash.setHint("Expected SHA-256 hash");
                  expectedHash.setTextColor(0xFFFFFFFF);
                  expectedHash.setHintTextColor(0xFF7890A3);
                  fairCard.addView(expectedHash);

                  Button verify = button("VERIFY SHA-256");
                  fairCard.addView(verify);

                  TextView verifyResult = text("", 12);
                  fairCard.addView(verifyResult);

                  verify.setOnClickListener(v -> {
                      String seed = serverSeed.getText().toString().trim();
                      String expected = expectedHash.getText().toString().trim().toLowerCase(Locale.US);

                      if (seed.isEmpty() || expected.length() != 64) {
                          verifyResult.setText(
                                  "Enter the revealed server seed and a 64-character SHA-256 hash.");
                          return;
                      }

                      try {
                          String actual = sha256(seed);
                          boolean ok = actual.equals(expected);

                          verifyResult.setText(
                                  ok
                                          ? "✓ VERIFIED — SHA-256 commitment matches."
                                          : "✗ NOT VERIFIED — hash does not match.");
                      } catch (Exception e) {
                          verifyResult.setText("Verification error.");
                      }
                  });

                  TextView fairInfo = text(
                          "Important: a provably-fair hash can verify a revealed result/seed. " +
                          "It does not reveal the next multiplier.",
                          11);
                  fairInfo.setTextColor(0xFFFFC857);
                  fairCard.addView(fairInfo);

                  root.addView(fairCard);

                  LinearLayout dataCard = card();
                  dataCard.addView(text("DATA & BACKUP", 18));

                  Button export = button("EXPORT CSV BACKUP");
                  Button importButton = button("IMPORT CSV BACKUP");
                  Button clear = button("CLEAR ALL LOCAL DATA");

                  dataCard.addView(export);
                  dataCard.addView(importButton);
                  dataCard.addView(clear);

                  export.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                      i.setType("text/csv");
                      i.putExtra(Intent.EXTRA_TITLE, "AviatorX-AI-V7-backup.csv");
                      exportLauncher.launch(i);
                  });

                  importButton.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.setType("text/*");
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      importLauncher.launch(i);
                  });

                  clear.setOnClickListener(v -> {
                      new androidx.appcompat.app.AlertDialog.Builder(this)
                              .setTitle("Clear all data?")
                              .setMessage("This removes all locally stored rounds.")
                              .setNegativeButton("CANCEL", null)
                              .setPositiveButton("CLEAR", (dialog, which) -> {
                                  rounds.clear();
                                  saveRounds();
                                  refreshAll();
                              })
                              .show();
                  });

                  root.addView(dataCard);

                  LinearLayout notificationCard = card();
                  notificationCard.addView(text("ANALYTICS REMINDERS", 18));

                  TextView notificationInfo = text(
                          "Optional reminders can tell you when to review historical analytics. " +
                          "They are not betting signals or guaranteed predictions.",
                          11);
                  notificationInfo.setTextColor(0xFF9FB1C1);
                  notificationCard.addView(notificationInfo);

                  Button notify5 = button("ENABLE 5M REMINDER");
                  Button notify15 = button("ENABLE 15M REMINDER");
                  Button notify30 = button("ENABLE 30M REMINDER");
                  Button notify60 = button("ENABLE 1H REMINDER");

                  notificationCard.addView(notify5);
                  notificationCard.addView(notify15);
                  notificationCard.addView(notify30);
                  notificationCard.addView(notify60);

                  notify5.setOnClickListener(v -> scheduleReminder(5, "5M"));
                  notify15.setOnClickListener(v -> scheduleReminder(15, "15M"));
                  notify30.setOnClickListener(v -> scheduleReminder(30, "30M"));
                  notify60.setOnClickListener(v -> scheduleReminder(60, "1H"));

                  root.addView(notificationCard);

                  LinearLayout statusCard = card();
                  statusCard.addView(text("V7 SYSTEM STATUS", 18));

                  qualityText = text("", 13);
                  statusCard.addView(qualityText);

                  TextView warning = text(
                          "⚠ RESPONSIBLE USE\n\n" +
                          "AviatorX AI analyses historical information. " +
                          "Past multipliers cannot guarantee future outcomes. " +
                          "Never treat analytics as guaranteed profit or financial advice.",
                          12);
                  warning.setTextColor(0xFFFFC857);
                  statusCard.addView(warning);

                  root.addView(statusCard);

                  setContentView(scroll);
                  refreshAll();
              }

              private Spinner spinner(String[] values) {
                  Spinner s = new Spinner(this);
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(
                          this,
                          android.R.layout.simple_spinner_item,
                          values);
                  adapter.setDropDownViewResource(
                          android.R.layout.simple_spinner_dropdown_item);
                  s.setAdapter(adapter);
                  return s;
              }

              private void refreshAll() {
                  updateDashboard();
                  updateCharts();
                  updateAnalytics();
                  refreshExplorer();
                  updateQuality();
              }

              private List<Round> selectedRounds() {
                  String selected = TIMEFRAMES[
                          timeframeSpinner.getSelectedItemPosition()];

                  ArrayList<Round> result = new ArrayList<>();

                  for (Round r : rounds) {
                      if (selected.equals("ALL TIME") ||
                              r.timeframe.equals(selected)) {
                          result.add(r);
                      }
                  }

                  return result;
              }

              private void updateDashboard() {
                  List<Round> data = selectedRounds();

                  if (data.isEmpty()) {
                      dashboardText.setText(
                              "No rounds available for this analysis view.\n\n" +
                              "Save completed rounds above to begin.");
                      return;
                  }

                  double sum = 0;
                  double high = Double.MIN_VALUE;
                  double low = Double.MAX_VALUE;

                  for (Round r : data) {
                      sum += r.multiplier;
                      high = Math.max(high, r.multiplier);
                      low = Math.min(low, r.multiplier);
                  }

                  double mean = sum / data.size();
                  double median = median(data);

                  dashboardText.setText(
                          "Rounds: " + data.size() +
                          "\nAverage: " + fmt(mean) + "x" +
                          "\nMedian: " + fmt(median) + "x" +
                          "\nHighest: " + fmt(high) + "x" +
                          "\nLowest: " + fmt(low) + "x" +
                          "\nCurrent view: " +
                          TIMEFRAMES[timeframeSpinner.getSelectedItemPosition()]);
              }

              private void updateAnalytics() {
                  List<Round> data = selectedRounds();

                  if (data.isEmpty()) {
                      analyticsText.setText("Waiting for data.");
                      return;
                  }

                  double mean = mean(data);
                  double deviation = standardDeviation(data);

                  int lowCount = 0;
                  int twoPlus = 0;
                  int fivePlus = 0;
                  int tenPlus = 0;

                  int currentLow = 0;
                  int longestLow = 0;
                  int currentHigh = 0;
                  int longestHigh = 0;

                  for (Round r : data) {
                      if (r.multiplier < 2.0) {
                          lowCount++;
                          currentLow++;
                          longestLow = Math.max(longestLow, currentLow);
                          currentHigh = 0;
                      } else {
                          twoPlus++;
                          currentHigh++;
                          longestHigh = Math.max(longestHigh, currentHigh);
                          currentLow = 0;
                      }

                      if (r.multiplier >= 5.0) fivePlus++;
                      if (r.multiplier >= 10.0) tenPlus++;
                  }

                  double lowPercent =
                          data.isEmpty() ? 0 : (lowCount * 100.0 / data.size());

                  analyticsText.setText(
                          "Mean: " + fmt(mean) + "x" +
                          "\nMedian: " + fmt(median(data)) + "x" +
                          "\nVolatility (SD): " + fmt(deviation) +
                          "\nBelow 2x: " + lowCount +
                          " (" + fmt(lowPercent) + "%)" +
                          "\n2x+: " + twoPlus +
                          "\n5x+: " + fivePlus +
                          "\n10x+: " + tenPlus +
                          "\nLongest <2x streak: " + longestLow +
                          "\nLongest 2x+ streak: " + longestHigh +
                          "\n\nAnalytical status: HISTORICAL ONLY");
              }

              private void updateQuality() {
                  int knownTimeframes = 0;

                  for (String tf : TIMEFRAMES) {
                      if (tf.equals("ALL TIME")) continue;

                      for (Round r : rounds) {
                          if (r.timeframe.equals(tf)) {
                              knownTimeframes++;
                              break;
                          }
                      }
                  }

                  qualityText.setText(
                          "Stored rounds: " + rounds.size() +
                          "\nTimeframe groups containing data: " + knownTimeframes +
                          "\nLocal storage: ACTIVE" +
                          "\nCharts: ACTIVE" +
                          "\nAdvanced analytics: ACTIVE" +
                          "\nProvably Fair SHA-256 verifier: ACTIVE" +
                          "\nCSV backup/restore: ACTIVE" +
                          "\nLive-data architecture: READY" +
                          "\nLive private eBet access: NOT CLAIMED");
              }

              private void updateCharts() {
                  if (lineChart != null) {
                      lineChart.invalidate();
                  }

                  if (distributionChart != null) {
                      distributionChart.invalidate();
                  }
              }

              private void refreshExplorer() {
                  if (explorerContainer == null) return;

                  explorerContainer.removeAllViews();

                  List<Round> filtered = new ArrayList<>(selectedRounds());

                  String filter = FILTERS[
                          filterSpinner.getSelectedItemPosition()];

                  String search = searchBox.getText().toString()
                          .trim().toLowerCase(Locale.US);

                  ArrayList<Round> result = new ArrayList<>();

                  for (Round r : filtered) {
                      boolean matchesFilter = matchesFilter(r.multiplier, filter);

                      String date = formatDate(r.timestamp).toLowerCase(Locale.US);

                      boolean matchesSearch =
                              search.isEmpty() ||
                              String.valueOf(r.multiplier).contains(search) ||
                              r.timeframe.toLowerCase(Locale.US).contains(search) ||
                              date.contains(search);

                      if (matchesFilter && matchesSearch) {
                          result.add(r);
                      }
                  }

                  String sort = SORTS[
                          sortSpinner.getSelectedItemPosition()];

                  if (sort.equals("HIGHEST")) {
                      Collections.sort(result,
                              (a, b) -> Double.compare(
                                      b.multiplier, a.multiplier));
                  } else if (sort.equals("LOWEST")) {
                      Collections.sort(result,
                              (a, b) -> Double.compare(
                                      a.multiplier, b.multiplier));
                  } else {
                      Collections.sort(result,
                              (a, b) -> Long.compare(
                                      b.timestamp, a.timestamp));
                  }

                  int maxDisplay = Math.min(result.size(), 100);

                  if (result.isEmpty()) {
                      explorerContainer.addView(
                              text("No matching rounds.", 12));
                      return;
                  }

                  TextView count = text(
                          "Showing " + maxDisplay + " of " + result.size(),
                          11);
                  count.setTextColor(0xFF9FB1C1);
                  explorerContainer.addView(count);

                  for (int i = 0; i < maxDisplay; i++) {
                      Round r = result.get(i);

                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      row.setGravity(Gravity.CENTER_VERTICAL);
                      row.setPadding(
                              dp(6), dp(6), dp(6), dp(6));

                      TextView info = text(
                              fmt(r.multiplier) + "x  •  " +
                              r.timeframe + "  •  " +
                              formatDate(r.timestamp),
                              12);

                      row.addView(info,
                              new LinearLayout.LayoutParams(
                                      0,
                                      ViewGroup.LayoutParams.WRAP_CONTENT,
                                      1));

                      Button delete = button("DELETE");

                      delete.setOnClickListener(v -> {
                          rounds.remove(r);
                          saveRounds();
                          refreshAll();
                      });

                      row.addView(delete);

                      explorerContainer.addView(row);
                  }
              }

              private boolean matchesFilter(double value, String filter) {
                  switch (filter) {
                      case "< 1.20x":
                          return value < 1.20;
                      case "1.20x - 2x":
                          return value >= 1.20 && value < 2.0;
                      case "2x - 5x":
                          return value >= 2.0 && value < 5.0;
                      case "5x - 10x":
                          return value >= 5.0 && value < 10.0;
                      case "10x+":
                          return value >= 10.0;
                      default:
                          return true;
                  }
              }

              private double mean(List<Round> data) {
                  if (data.isEmpty()) return 0;

                  double sum = 0;

                  for (Round r : data) {
                      sum += r.multiplier;
                  }

                  return sum / data.size();
              }

              private double median(List<Round> data) {
                  if (data.isEmpty()) return 0;

                  ArrayList<Double> values = new ArrayList<>();

                  for (Round r : data) {
                      values.add(r.multiplier);
                  }

                  Collections.sort(values);

                  int middle = values.size() / 2;

                  if (values.size() % 2 == 0) {
                      return (values.get(middle - 1) + values.get(middle)) / 2.0;
                  }

                  return values.get(middle);
              }

              private double standardDeviation(List<Round> data) {
                  if (data.size() < 2) return 0;

                  double m = mean(data);
                  double sum = 0;

                  for (Round r : data) {
                      double d = r.multiplier - m;
                      sum += d * d;
                  }

                  return Math.sqrt(sum / data.size());
              }

              private String fmt(double value) {
                  if (value >= 1000) {
                      return String.format(Locale.US, "%.0f", value);
                  }

                  if (value >= 100) {
                      return String.format(Locale.US, "%.1f", value);
                  }

                  return String.format(Locale.US, "%.2f", value);
              }

              private String formatDate(long timestamp) {
                  if (timestamp <= 0) return "Legacy data";

                  SimpleDateFormat sdf =
                          new SimpleDateFormat(
                                  "yyyy-MM-dd HH:mm",
                                  Locale.US);

                  return sdf.format(new Date(timestamp));
              }

              private void saveRounds() {
                  StringBuilder sb = new StringBuilder();

                  for (Round r : rounds) {
                      sb.append(r.multiplier)
                              .append("|")
                              .append(r.timestamp)
                              .append("|")
                              .append(r.timeframe)
                              .append("\n");
                  }

                  prefs.edit()
                          .putString(DATA_KEY, sb.toString())
                          .apply();
              }

              private void loadRounds() {
                  rounds.clear();

                  String saved = prefs.getString(DATA_KEY, "");

                  if (!saved.isEmpty()) {
                      String[] lines = saved.split("\\n");

                      for (String line : lines) {
                          try {
                              String[] p = line.split("\\|", -1);

                              if (p.length >= 3) {
                                  double multiplier =
                                          Double.parseDouble(p[0]);

                                  long timestamp =
                                          Long.parseLong(p[1]);

                                  String timeframe = p[2];

                                  rounds.add(new Round(
                                          multiplier,
                                          timestamp,
                                          timeframe));
                              }
                          } catch (Exception ignored) {
                          }
                      }

                      return;
                  }

                  /*
                   * V3 compatibility.
                   * Older V3 installations stored only comma-separated
                   * multipliers. We import those values as legacy data
                   * without inventing timestamps or timeframes.
                   */
                  String old = getSharedPreferences(
                          "AviatorXAI",
                          MODE_PRIVATE)
                          .getString("rounds", "");

                  if (!old.isEmpty()) {
                      String[] values = old.split(",");

                      for (String value : values) {
                          try {
                              double m = Double.parseDouble(value.trim());

                              if (m >= 1.0 && m <= 1000000.0) {
                                  rounds.add(new Round(
                                          m,
                                          0,
                                          "ALL TIME"));
                              }
                          } catch (Exception ignored) {
                          }
                      }

                      saveRounds();
                  }
              }

              private String sha256(String input) throws Exception {
                  MessageDigest digest =
                          MessageDigest.getInstance("SHA-256");

                  byte[] hash =
                          digest.digest(input.getBytes(
                                  StandardCharsets.UTF_8));

                  StringBuilder hex = new StringBuilder();

                  for (byte b : hash) {
                      String h = Integer.toHexString(0xff & b);

                      if (h.length() == 1) {
                          hex.append('0');
                      }

                      hex.append(h);
                  }

                  return hex.toString();
              }

              private void exportCsv(Uri uri) {
                  try {
                      OutputStream out =
                              getContentResolver().openOutputStream(uri);

                      StringBuilder csv = new StringBuilder();

                      csv.append("multiplier,timestamp,timeframe\n");

                      for (Round r : rounds) {
                          csv.append(r.multiplier)
                                  .append(",")
                                  .append(r.timestamp)
                                  .append(",")
                                  .append(r.timeframe)
                                  .append("\n");
                      }

                      out.write(csv.toString()
                              .getBytes(StandardCharsets.UTF_8));

                      out.close();

                      Toast.makeText(this,
                              "CSV backup exported.",
                              Toast.LENGTH_SHORT).show();

                  } catch (Exception e) {
                      Toast.makeText(this,
                              "Export failed.",
                              Toast.LENGTH_SHORT).show();
                  }
              }

              private void importCsv(Uri uri) {
                  try {
                      BufferedReader reader =
                              new BufferedReader(
                                      new InputStreamReader(
                                              getContentResolver()
                                                      .openInputStream(uri),
                                              StandardCharsets.UTF_8));

                      String line;
                      int imported = 0;

                      while ((line = reader.readLine()) != null) {
                          if (line.toLowerCase(Locale.US)
                                  .startsWith("multiplier")) {
                              continue;
                          }

                          String[] p = line.split(",", -1);

                          if (p.length < 1) continue;

                          try {
                              double multiplier =
                                      Double.parseDouble(p[0].trim());

                              long timestamp =
                                      p.length >= 2
                                              ? Long.parseLong(p[1].trim())
                                              : 0;

                              String timeframe =
                                      p.length >= 3 &&
                                      !p[2].trim().isEmpty()
                                              ? p[2].trim()
                                              : "ALL TIME";

                              if (multiplier >= 1.0 &&
                                      multiplier <= 1000000.0) {

                                  rounds.add(new Round(
                                          multiplier,
                                          timestamp,
                                          timeframe));

                                  imported++;
                              }

                          } catch (Exception ignored) {
                          }
                      }

                      reader.close();

                      saveRounds();
                      refreshAll();

                      Toast.makeText(this,
                              "Imported " + imported + " rounds.",
                              Toast.LENGTH_SHORT).show();

                  } catch (Exception e) {
                      Toast.makeText(this,
                              "Import failed.",
                              Toast.LENGTH_SHORT).show();
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel =
                              new NotificationChannel(
                                      "analytics",
                                      "AviatorX Analytics",
                                      NotificationManager.IMPORTANCE_DEFAULT);

                      channel.setDescription(
                              "Historical AviatorX analytics reminders.");

                      NotificationManager manager =
                              getSystemService(NotificationManager.class);

                      manager.createNotificationChannel(channel);
                  }
              }

              private void scheduleReminder(int minutes, String timeframe) {
                  if (Build.VERSION.SDK_INT >= 33 &&
                          ContextCompat.checkSelfPermission(
                                  this,
                                  Manifest.permission.POST_NOTIFICATIONS)
                                  != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.POST_NOTIFICATIONS
                              },
                              501);

                      Toast.makeText(this,
                              "Allow notifications, then tap the reminder again.",
                              Toast.LENGTH_LONG).show();
                      return;
                  }

                  NotificationManager manager =
                          (NotificationManager)
                                  getSystemService(
                                          Context.NOTIFICATION_SERVICE);

                  NotificationCompat.Builder notification =
                          new NotificationCompat.Builder(
                                  this,
                                  "analytics")
                                  .setSmallIcon(
                                          android.R.drawable.ic_dialog_info)
                                  .setContentTitle(
                                          "AviatorX AI • " + timeframe)
                                  .setContentText(
                                          "Review historical analytics. " +
                                          "No guaranteed prediction.")
                                  .setPriority(
                                          NotificationCompat.PRIORITY_DEFAULT)
                                  .setAutoCancel(true);

                  manager.notify(
                          700 + minutes,
                          notification.build());

                  Toast.makeText(this,
                          timeframe +
                          " analytics reminder enabled for this session.",
                          Toast.LENGTH_SHORT).show();
              }

              private static class Round {
                  final double multiplier;
                  final long timestamp;
                  final String timeframe;

                  Round(double multiplier,
                        long timestamp,
                        String timeframe) {
                      this.multiplier = multiplier;
                      this.timestamp = timestamp;
                      this.timeframe = timeframe;
                  }
              }

              private class ChartView extends View {

                  private final Paint paint = new Paint(
                          Paint.ANTI_ALIAS_FLAG);

                  ChartView(Context context) {
                      super(context);
                      paint.setStrokeWidth(dp(2));
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);

                      canvas.drawColor(0xFF0B1622);

                      List<Round> data = selectedRounds();

                      if (data.isEmpty()) {
                          paint.setTextSize(dp(13));
                          paint.setColor(0xFF9FB1C1);
                          canvas.drawText(
                                  "No chart data yet.",
                                  dp(20),
                                  getHeight() / 2f,
                                  paint);
                          return;
                      }

                      int start = Math.max(0, data.size() - 30);

                      List<Round> recent =
                              data.subList(start, data.size());

                      double max = 2.0;

                      for (Round r : recent) {
                          max = Math.max(max, r.multiplier);
                      }

                      float left = dp(18);
                      float right = getWidth() - dp(18);
                      float top = dp(18);
                      float bottom = getHeight() - dp(25);

                      paint.setColor(0xFF33485B);
                      paint.setStrokeWidth(dp(1));

                      canvas.drawLine(
                              left, bottom,
                              right, bottom,
                              paint);

                      canvas.drawLine(
                              left, top,
                              left, bottom,
                              paint);

                      paint.setColor(0xFF00E676);
                      paint.setStrokeWidth(dp(2.5f));
                      paint.setStyle(Paint.Style.STROKE);

                      RectF area = new RectF(
                              left,
                              top,
                              right,
                              bottom);

                      if (recent.size() > 1) {
                          float previousX = left;
                          float previousY = bottom -
                                  (float) ((recent.get(0).multiplier / max) *
                                          (bottom - top));

                          for (int i = 1; i < recent.size(); i++) {
                              float x = left +
                                      ((right - left) * i /
                                              (recent.size() - 1));

                              float y = bottom -
                                      (float) ((recent.get(i).multiplier / max) *
                                              (bottom - top));

                              canvas.drawLine(
                                      previousX,
                                      previousY,
                                      x,
                                      y,
                                      paint);

                              previousX = x;
                              previousY = y;
                          }
                      }

                      paint.setStyle(Paint.Style.FILL);
                      paint.setTextSize(dp(10));
                      paint.setColor(0xFF9FB1C1);

                      canvas.drawText(
                              "Recent " + recent.size() + " rounds",
                              left,
                              getHeight() - dp(8),
                              paint);

                      canvas.drawText(
                              "Max " + fmt(max) + "x",
                              right - dp(70),
                              top + dp(10),
                              paint);
                  }
              }

              private class DistributionView extends View {

                  private final Paint paint = new Paint(
                          Paint.ANTI_ALIAS_FLAG);

                  DistributionView(Context context) {
                      super(context);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);

                      canvas.drawColor(0xFF0B1622);

                      List<Round> data = selectedRounds();

                      int[] buckets = new int[5];

                      for (Round r : data) {
                          if (r.multiplier < 1.20) {
                              buckets[0]++;
                          } else if (r.multiplier < 2.0) {
                              buckets[1]++;
                          } else if (r.multiplier < 5.0) {
                              buckets[2]++;
                          } else if (r.multiplier < 10.0) {
                              buckets[3]++;
                          } else {
                              buckets[4]++;
                          }
                      }

                      int max = 1;

                      for (int b : buckets) {
                          max = Math.max(max, b);
                      }

                      String[] labels = {
                              "<1.20",
                              "1.2-2",
                              "2-5",
                              "5-10",
                              "10+"
                      };

                      float width = getWidth() / 5f;
                      float base = getHeight() - dp(35);
                      float maxHeight = getHeight() - dp(75);

                      paint.setTextSize(dp(10));
                      paint.setTextAlign(Paint.Align.CENTER);

                      for (int i = 0; i < 5; i++) {
                          float barHeight =
                                  maxHeight * buckets[i] / (float) max;

                          float left = i * width + dp(8);
                          float right = (i + 1) * width - dp(8);
                          float top = base - barHeight;

                          paint.setColor(0xFF00E676);

                          canvas.drawRect(
                                  left,
                                  top,
                                  right,
                                  base,
                                  paint);

                          paint.setColor(0xFFE8F1F8);

                          canvas.drawText(
                                  String.valueOf(buckets[i]),
                                  (left + right) / 2,
                                  top - dp(6),
                                  paint);

                          paint.setColor(0xFF9FB1C1);

                          canvas.drawText(
                                  labels[i],
                                  (left + right) / 2,
                                  base + dp(20),
                                  paint);
                      }

                      paint.setTextAlign(Paint.Align.LEFT);
                  }
              }
          }
          EOF

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build V7 debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/AviatorX-AI-V7.0-FINAL.apk

      - name: Upload V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: AviatorX-AI-V7.0-FINAL-APK
          path: app/build/outputs/apk/debug/AviatorX-AI-V7.0-FINAL.apk
          if-no-files-found: error
