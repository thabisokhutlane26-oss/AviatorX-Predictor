name: Build AviatorX AI V3 Professional

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build AviatorX AI V3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/aviatorx/predictor
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AviatorXAI"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          mkdir -p app

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aviatorx.predictor'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aviatorx.predictor'
                  minSdk 23
                  targetSdk 35
                  versionCode 30
                  versionName '3.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="AviatorX AI"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="Theme.MaterialComponents.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080808</item>
                  <item name="android:navigationBarColor">#080808</item>
                  <item name="android:colorAccent">#FFD400</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/drawable/card.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#151515"/>
              <corners android:radius="18dp"/>
              <stroke
                  android:width="1dp"
                  android:color="#292929"/>
              <padding
                  android:left="16dp"
                  android:top="16dp"
                  android:right="16dp"
                  android:bottom="16dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/button.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFD400"/>
              <corners android:radius="14dp"/>
              <padding
                  android:left="18dp"
                  android:top="12dp"
                  android:right="18dp"
                  android:bottom="12dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/input.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#111111"/>
              <corners android:radius="12dp"/>
              <stroke
                  android:width="1dp"
                  android:color="#333333"/>
              <padding
                  android:left="14dp"
                  android:top="12dp"
                  android:right="14dp"
                  android:bottom="12dp"/>
          </shape>
          EOF

          cat > app/src/main/java/com/aviatorx/predictor/MainActivity.kt <<'EOF'
          package com.aviatorx.predictor

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.ViewGroup
          import android.widget.*
          import java.security.MessageDigest
          import java.util.Locale

          class MainActivity : Activity() {

              private lateinit var historyText: TextView
              private lateinit var statsText: TextView
              private lateinit var analysisText: TextView
              private lateinit var roundInput: EditText

              private val prefs by lazy {
                  getSharedPreferences("aviatorx_v3", MODE_PRIVATE)
              }

              private val rounds = mutableListOf<Double>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  loadRounds()
                  buildInterface()
                  refresh()
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun text(
                  value: String,
                  size: Float,
                  bold: Boolean = false
              ): TextView {
                  return TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(Color.WHITE)

                      if (bold) {
                          typeface = Typeface.DEFAULT_BOLD
                      }
                  }
              }

              private fun card(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL

                      setPadding(
                          dp(16),
                          dp(16),
                          dp(16),
                          dp(16)
                      )

                      background =
                          resources.getDrawable(
                              R.drawable.card,
                              theme
                          )

                      layoutParams =
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              setMargins(
                                  0,
                                  dp(7),
                                  0,
                                  dp(7)
                              )
                          }
                  }
              }

              private fun buildInterface() {

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.rgb(7, 7, 7))
                      setPadding(
                          dp(16),
                          dp(14),
                          dp(16),
                          dp(20)
                      )
                  }

                  val scroll = ScrollView(this)

                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val header =
                      text(
                          "✈ AVIATORX AI",
                          28f,
                          true
                      )

                  header.setTextColor(
                      Color.rgb(255, 212, 0)
                  )

                  content.addView(header)

                  val subtitle =
                      text(
                          "PROFESSIONAL ANALYTICS • V3.0",
                          12f,
                          true
                      )

                  subtitle.setTextColor(Color.LTGRAY)

                  content.addView(subtitle)

                  val status =
                      text(
                          "● SYSTEM READY\nHistorical-data analysis mode",
                          14f,
                          true
                      )

                  status.setTextColor(
                      Color.rgb(100, 255, 130)
                  )

                  status.setPadding(
                      0,
                      dp(12),
                      0,
                      dp(12)
                  )

                  content.addView(status)

                  val owner =
                      text(
                          "Made by Thabiso Khutlane",
                          12f
                      )

                  owner.setTextColor(Color.GRAY)

                  content.addView(owner)

                  val overview = card()

                  overview.addView(
                      text(
                          "PERFORMANCE OVERVIEW",
                          16f,
                          true
                      )
                  )

                  statsText = text("", 15f)

                  statsText.setPadding(
                      0,
                      dp(12),
                      0,
                      0
                  )

                  overview.addView(statsText)

                  content.addView(overview)

                  val inputCard = card()

                  inputCard.addView(
                      text(
                          "ADD COMPLETED ROUND",
                          16f,
                          true
                      )
                  )

                  val hint =
                      text(
                          "Enter a completed multiplier only, e.g. 1.42",
                          12f
                      )

                  hint.setTextColor(Color.GRAY)

                  inputCard.addView(hint)

                  roundInput =
                      EditText(this).apply {

                          hint = "Multiplier"

                          setHintTextColor(Color.GRAY)
                          setTextColor(Color.WHITE)

                          textSize = 16f

                          inputType =
                              2 or 8192

                          background =
                              resources.getDrawable(
                                  R.drawable.input,
                                  theme
                              )
                      }

                  inputCard.addView(
                      roundInput,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(55)
                      ).apply {
                          setMargins(
                              0,
                              dp(10),
                              0,
                              dp(10)
                          )
                      }
                  )

                  val addButton =
                      Button(this).apply {

                          text = "ADD ROUND"

                          setTextColor(Color.BLACK)

                          typeface =
                              Typeface.DEFAULT_BOLD

                          background =
                              resources.getDrawable(
                                  R.drawable.button,
                                  theme
                              )

                          setOnClickListener {
                              addRound()
                          }
                      }

                  inputCard.addView(
                      addButton,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(52)
                      )
                  )

                  content.addView(inputCard)

                  val analysisCard = card()

                  analysisCard.addView(
                      text(
                          "ADVANCED ANALYTICS",
                          16f,
                          true
                      )
                  )

                  analysisText =
                      text("", 14f)

                  analysisText.setPadding(
                      0,
                      dp(12),
                      0,
                      0
                  )

                  analysisCard.addView(
                      analysisText
                  )

                  content.addView(
                      analysisCard
                  )

                  val historyCard = card()

                  historyCard.addView(
                      text(
                          "RECENT ROUNDS",
                          16f,
                          true
                      )
                  )

                  historyText =
                      text("", 14f)

                  historyText.setPadding(
                      0,
                      dp(10),
                      0,
                      0
                  )

                  historyCard.addView(
                      historyText
                  )

                  val clearButton =
                      Button(this).apply {

                          text = "CLEAR HISTORY"

                          setTextColor(Color.WHITE)

                          setBackgroundColor(
                              Color.rgb(55, 55, 55)
                          )

                          setOnClickListener {

                              rounds.clear()

                              saveRounds()

                              refresh()
                          }
                      }

                  historyCard.addView(
                      clearButton,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(50)
                      ).apply {
                          setMargins(
                              0,
                              dp(14),
                              0,
                              0
                          )
                      }
                  )

                  content.addView(
                      historyCard
                  )

                  val fairCard = card()

                  fairCard.addView(
                      text(
                          "PROVABLY FAIR VERIFIER",
                          16f,
                          true
                      )
                  )

                  val serverInput =
                      EditText(this).apply {

                          hint =
                              "Revealed server seed"

                          setHintTextColor(
                              Color.GRAY
                          )

                          setTextColor(
                              Color.WHITE
                          )

                          textSize = 14f

                          background =
                              resources.getDrawable(
                                  R.drawable.input,
                                  theme
                              )
                      }

                  val hashInput =
                      EditText(this).apply {

                          hint =
                              "Server seed SHA-256"

                          setHintTextColor(
                              Color.GRAY
                          )

                          setTextColor(
                              Color.WHITE
                          )

                          textSize = 14f

                          background =
                              resources.getDrawable(
                                  R.drawable.input,
                                  theme
                              )
                      }

                  fairCard.addView(
                      serverInput,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(55)
                      ).apply {
                          setMargins(
                              0,
                              dp(10),
                              0,
                              dp(8)
                          )
                      }
                  )

                  fairCard.addView(
                      hashInput,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(55)
                      ).apply {
                          setMargins(
                              0,
                              0,
                              0,
                              dp(10)
                          )
                      }
                  )

                  val verifyButton =
                      Button(this).apply {

                          text =
                              "VERIFY SHA-256"

                          setTextColor(Color.BLACK)

                          typeface =
                              Typeface.DEFAULT_BOLD

                          background =
                              resources.getDrawable(
                                  R.drawable.button,
                                  theme
                              )

                          setOnClickListener {

                              val serverSeed =
                                  serverInput.text
                                      .toString()
                                      .trim()

                              val expectedHash =
                                  hashInput.text
                                      .toString()
                                      .trim()
                                      .lowercase(
                                          Locale.US
                                      )

                              if (
                                  serverSeed.isEmpty() ||
                                  expectedHash.isEmpty()
                              ) {

                                  Toast.makeText(
                                      this@MainActivity,
                                      "Enter both values",
                                      Toast.LENGTH_SHORT
                                  ).show()

                                  return@setOnClickListener
                              }

                              val actualHash =
                                  sha256(serverSeed)

                              if (
                                  expectedHash.length != 64 ||
                                  !expectedHash.matches(
                                      Regex(
                                          "[0-9a-f]{64}"
                                      )
                                  )
                              ) {

                                  Toast.makeText(
                                      this@MainActivity,
                                      "Hash must contain 64 hexadecimal characters",
                                      Toast.LENGTH_LONG
                                  ).show()

                                  return@setOnClickListener
                              }

                              val verified =
                                  actualHash ==
                                      expectedHash

                              Toast.makeText(
                                  this@MainActivity,
                                  if (verified)
                                      "✓ VERIFIED — SHA-256 matches"
                                  else
                                      "✕ NOT VERIFIED — Hash does not match",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }

                  fairCard.addView(
                      verifyButton,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(52)
                      )
                  )

                  val fairInfo =
                      text(
                          "\nA SHA-256 commitment can be checked against a revealed server seed after the round. Verification confirms the commitment; it does not predict future results.",
                          12f
                      )

                  fairInfo.setTextColor(
                      Color.GRAY
                  )

                  fairCard.addView(
                      fairInfo
                  )

                  content.addView(
                      fairCard
                  )

                  val warning = card()

                  val warningTitle =
                      text(
                          "RESPONSIBLE USE",
                          16f,
                          true
                      )

                  warningTitle.setTextColor(
                      Color.rgb(255, 212, 0)
                  )

                  warning.addView(
                      warningTitle
                  )

                  val warningText =
                      text(
                          "AviatorX AI analyses historical data. Historical statistics cannot guarantee or predict the next game outcome. Never treat analytics as a guaranteed betting signal.",
                          13f
                      )

                  warningText.setTextColor(
                      Color.LTGRAY
                  )

                  warningText.setPadding(
                      0,
                      dp(10),
                      0,
                      0
                  )

                  warning.addView(
                      warningText
                  )

                  content.addView(
                      warning
                  )

                  val footer =
                      text(
                          "\nAVIATORX AI V3.0\nAnalytics • Verification • History",
                          11f
                      )

                  footer.gravity =
                      android.view.Gravity.CENTER

                  footer.setTextColor(
                      Color.GRAY
                  )

                  content.addView(
                      footer
                  )

                  scroll.addView(content)

                  root.addView(
                      scroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  setContentView(root)
              }

              private fun addRound() {

                  val value =
                      roundInput.text
                          .toString()
                          .trim()
                          .replace(",", ".")
                          .toDoubleOrNull()

                  if (
                      value == null ||
                      value < 1.0
                  ) {

                      Toast.makeText(
                          this,
                          "Enter a valid multiplier of 1.00 or higher",
                          Toast.LENGTH_SHORT
                      ).show()

                      return
                  }

                  if (value > 1000000.0) {

                      Toast.makeText(
                          this,
                          "Multiplier is too large",
                          Toast.LENGTH_SHORT
                      ).show()

                      return
                  }

                  rounds.add(value)

                  saveRounds()

                  roundInput.text.clear()

                  refresh()

                  Toast.makeText(
                      this,
                      "Round added",
                      Toast.LENGTH_SHORT
                  ).show()
              }

              private fun refresh() {

                  if (rounds.isEmpty()) {

                      statsText.text =
                          "Rounds: 0\n" +
                          "Average: —\n" +
                          "Median: —\n" +
                          "Lowest: —\n" +
                          "Highest: —"

                      analysisText.text =
                          "No completed rounds yet.\n\n" +
                          "Add completed results to activate analytics."

                      historyText.text =
                          "No rounds recorded."

                      return
                  }

                  val sorted =
                      rounds.sorted()

                  val average =
                      rounds.average()

                  val median =
                      if (sorted.size % 2 == 0) {
                          (
                              sorted[
                                  sorted.size / 2 - 1
                              ] +
                              sorted[
                                  sorted.size / 2
                              ]
                          ) / 2.0
                      } else {
                          sorted[
                              sorted.size / 2
                          ]
                      }

                  val lowest =
                      sorted.first()

                  val highest =
                      sorted.last()

                  statsText.text =
                      "Rounds: ${rounds.size}\n" +
                      "Average: ${format(average)}x\n" +
                      "Median: ${format(median)}x\n" +
                      "Lowest: ${format(lowest)}x\n" +
                      "Highest: ${format(highest)}x"

                  analysisText.text =
                      buildAnalysis()

                  val recent =
                      rounds
                          .takeLast(20)
                          .asReversed()

                  historyText.text =
                      recent
                          .mapIndexed { index, value ->
                              "#${recent.size - index}   ${format(value)}x"
                          }
                          .joinToString("\n")
              }

              private fun buildAnalysis(): String {

                  val windows =
                      listOf(
                          10,
                          25,
                          50,
                          100
                      )

                  val builder =
                      StringBuilder()

                  for (window in windows) {

                      if (rounds.size < window) {

                          builder.append(
                              "Last $window rounds: insufficient data\n"
                          )

                          continue
                      }

                      val data =
                          rounds.takeLast(window)

                      val average =
                          data.average()

                      val below120 =
                          data.count {
                              it < 1.20
                          }

                      val between120and2 =
                          data.count {
                              it >= 1.20 &&
                              it < 2.0
                          }

                      val between2and5 =
                          data.count {
                              it >= 2.0 &&
                              it < 5.0
                          }

                      val between5and10 =
                          data.count {
                              it >= 5.0 &&
                              it < 10.0
                          }

                      val above10 =
                          data.count {
                              it >= 10.0
                          }

                      builder.append(
                          "LAST $window ROUNDS\n"
                      )

                      builder.append(
                          "Average: ${format(average)}x\n"
                      )

                      builder.append(
                          "<1.20x: " +
                          "${percentage(below120, window)}%\n"
                      )

                      builder.append(
                          "1.20–2x: " +
                          "${percentage(between120and2, window)}%\n"
                      )

                      builder.append(
                          "2–5x: " +
                          "${percentage(between2and5, window)}%\n"
                      )

                      builder.append(
                          "5–10x: " +
                          "${percentage(between5and10, window)}%\n"
                      )

                      builder.append(
                          "10x+: " +
                          "${percentage(above10, window)}%\n\n"
                      )
                  }

                  builder.append(
                      "STATISTICAL STATUS\n"
                  )

                  builder.append(
                      "Historical analysis only.\n"
                  )

                  builder.append(
                      "No guaranteed next-round prediction."
                  )

                  return builder.toString()
              }

              private fun percentage(
                  count: Int,
                  total: Int
              ): String {

                  return String.format(
                      Locale.US,
                      "%.1f",
                      count.toDouble() *
                          100.0 /
                          total
                  )
              }

              private fun format(
                  value: Double
              ): String {

                  return String.format(
                      Locale.US,
                      "%.2f",
                      value
                  )
              }

              private fun sha256(
                  value: String
              ): String {

                  val digest =
                      MessageDigest.getInstance(
                          "SHA-256"
                      )

                  val bytes =
                      digest.digest(
                          value.toByteArray()
                      )

                  return bytes.joinToString("") {
                      "%02x".format(it)
                  }
              }

              private fun saveRounds() {

                  prefs.edit()
                      .putString(
                          "rounds",
                          rounds.joinToString(",")
                      )
                      .apply()
              }

              private fun loadRounds() {

                  val encoded =
                      prefs.getString(
                          "rounds",
                          ""
                      ) ?: ""

                  if (encoded.isEmpty()) {
                      return
                  }

                  encoded.split(",").forEach {

                      val value =
                          it.toDoubleOrNull()

                      if (
                          value != null &&
                          value >= 1.0
                      ) {
                          rounds.add(value)
                      }
                  }
              }
          }
          EOF

          cat > gradlew <<'EOF'
          #!/bin/sh
          exec gradle "$@"
          EOF

          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: AviatorX-AI-V3.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
